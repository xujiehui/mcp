name: Moonvy MCP CI

on:
  push:
    paths:
      - 'servers/moonvy/**'
      - '.github/workflows/moonvy.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'servers/moonvy/**'
      - '.github/workflows/moonvy.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/moonvy
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: servers/moonvy/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --version
      - run: node dist/cli.js --help
      - run: npm run verify:baseline -- baselines/synthetic.json --genome baselines/synthetic-genome.json
      - run: npm pack --dry-run --ignore-scripts
